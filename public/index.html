<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Scramjet</title>

		<link rel="shortcut icon" content="favicon.webp" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<div title="Scramjet Logo" class="flex-center logo-wrapper header-center">
			<img class="logo" src="sj.png" alt="Scramjet" />
			<h1>Scramjet | MW</h1>
		</div>
		<div class="flex-center desc left-margin">
			<p>
				Scramjet is an experimental interception based web proxy designed to
				evade internet censorship, bypass arbitrary web browser restrictions and
				innovate web proxy technologies.
			</p>
		</div>

		<form id="sj-form" class="flex-center">
			<input
				id="sj-search-engine"
				value="https://www.google.com/search?q=%s"
				type="hidden"
			/>
			<input id="sj-address" type="text" placeholder="Search the web freely" />
		</form>
		<div class="desc left-margin">
			<p id="sj-error"></p>
			<pre id="sj-error-code"></pre>
		</div>
		<footer>
			<div>
				<a
					title="The Mercury Workshop GitHub organization"
					href="https://github.com/MercuryWorkshop"
					>Mercury Workshop</a
				>
				<a
					title="The example demo app for Scramjet"
					href="https://github.com/MercuryWorkshop/Scramjet-Demo"
					>GitHub</a
				>
				<a title="License information" href="credits.html">Credits</a>
			</div>
			<div>
				<span>Scramjet &copy; MW 2025</span>
			</div>
		</footer>
		<script>
  // 1. Lanzador about:blank (Abre el proxy en pestaña invisible y redirige la actual)
  if (window.top === window.self && !window.location.href.includes('about:blank')) {
    const win = window.open('about:blank', '_blank');
    if (win) {
      win.document.body.style.margin = '0';
      win.document.body.style.height = '100vh';
      const iframe = win.document.createElement('iframe');
      iframe.style.border = 'none';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.src = window.location.href;
      win.document.body.appendChild(iframe);
      window.location.replace('https://classroom.google.com');
    }
  }

  // 2. BOTÓN DE PÁNICO: Presionar 'Escape' te manda a Google Classroom
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      window.location.href = 'https://classroom.google.com';
    }
  });

  // 3. TAB CLOAKING: Disfraz de Google Drive
  document.title = 'My Drive - Google Drive';
  let favicon = document.querySelector("link[rel*='icon']") || document.createElement('link');
  favicon.type = 'image/x-icon';
  favicon.rel = 'shortcut icon';
  favicon.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
  document.getElementsByTagName('head')[0].appendChild(favicon);
</script>
	</body>
</html>
