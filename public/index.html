<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Drive - Google Drive</title>
    <link rel="shortcut icon" href="https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png" type="image/x-icon" />

    <script src="/scram/scramjet.all.js"></script>
    <script src="/baremux/index.js"></script>
    <script src="register-sw.js" defer></script>
    <script src="search.js" defer></script>
    <script src="index.js" defer></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d0f12;
            color: #e6e8ec;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
        }

        header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 1px;
        }

        .brand-icon {
            width: 22px;
            height: 22px;
            background: #6366f1;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        .badge {
            background-color: #1a1d24;
            border: 1px solid #2a2e39;
            color: #9ca3af;
            font-size: 0.8rem;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .btn-icon {
            background: #1a1d24;
            border: 1px solid #2a2e39;
            color: #9ca3af;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: #262a36;
            color: #fff;
        }

        main {
            width: 100%;
            max-width: 720px;
            text-align: center;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .hero-title {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .hero-subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
            margin-top: -14px;
        }

        #sj-form {
            width: 100%;
            background-color: #16181e;
            border: 1px solid #262a35;
            border-radius: 14px;
            padding: 6px 8px 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        .engine-select {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            padding-right: 8px;
            border-right: 1px solid #262a35;
        }

        .engine-select option {
            background-color: #16181e;
            color: #fff;
        }

        #sj-address {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            padding: 10px 0;
        }

        #sj-address::placeholder {
            color: #6b7280;
        }

        .btn-submit {
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-submit:hover {
            background: #4338ca;
        }

        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 12px;
            width: 100%;
        }

        .shortcut-card {
            background-color: #16181e;
            border: 1px solid #222633;
            border-radius: 12px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: #d1d5db;
        }

        .shortcut-card:hover {
            background-color: #1f232d;
            border-color: #4f46e5;
            transform: translateY(-2px);
            color: #fff;
        }

        .shortcut-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .shortcut-label {
            font-size: 0.82rem;
            font-weight: 500;
        }

        footer {
            color: #6b7280;
            font-size: 0.8rem;
            text-align: center;
        }

        #sj-error {
            color: #ef4444;
            font-size: 0.9rem;
        }

        /* Oculto por defecto; se expande a pantalla completa solo al buscar */
        #sj-frame {
            display: none;
        }

        #sj-frame.active {
            display: block !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            border: none !important;
            z-index: 9999 !important;
            background-color: #0d0f12 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            <span>AETHER</span>
        </div>

        <div class="badge">
            <span class="badge-dot"></span>
            <span>Scramjet + Epoxy</span>
        </div>

        <div class="nav-actions">
            <button class="btn-icon" id="stealth-btn" title="Open in Stealth Mode (about:blank)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/><path d="M12 6v6l4 2"/></svg>
            </button>
        </div>
    </header>

    <main>
        <h1 class="hero-title">Unrestricted Browsing</h1>
        <p class="hero-subtitle">Ultra-fast web proxy optimized for low memory and network usage.</p>

        <form id="sj-form">
            <select class="engine-select" id="engine-selector">
                <option value="https://www.google.com/search?q=%s">Google</option>
                <option value="https://duckduckgo.com/?q=%s">DuckDuckGo</option>
                <option value="https://www.bing.com/search?q=%s">Bing</option>
            </select>

            <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
            <input id="sj-address" type="text" placeholder="Search the web or enter a URL..." required />

            <button type="submit" class="btn-submit">
                Go <span>&rarr;</span>
            </button>
        </form>

                <span class="shortcut-label">Spotify</span>
            </div>

        <div class="desc left-margin">
            <p id="sj-error"></p>
            <pre id="sj-error-code"></pre>
        </div>
    </main>

    <footer>
        <span>Aether Proxy System &bull; Framework-Free Optimized Interface</span>
    </footer>

    <script>
        // Sincronizar el selector de motor con el input oculto de Scramjet
        document.getElementById('engine-selector').addEventListener('change', (e) => {
            document.getElementById('sj-search-engine').value = e.target.value;
        });

        // Función para enviar URL desde las tarjetas de atajos
        function launchUrl(url) {
            const input = document.getElementById('sj-address');
            input.value = url;
            document.getElementById('sj-form').dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }

        // Botón Lanzador de Modo Sigiloso (about:blank)
        document.getElementById('stealth-btn').addEventListener('click', () => {
            const win = window.open('about:blank', '_blank');
            if (win) {
                win.document.body.style.margin = '0';
                win.document.body.style.height = '100vh';
                const iframe = win.document.createElement('iframe');
                iframe.style.border = 'none';
                iframe.style.width = '100%';
                iframe.style.height = '100%';
                iframe.src = window.location.href;
                win.document.body.appendChild(iframe);
                window.location.replace('https://classroom.google.com');
            }
        });

        // Botón de Pánico: Presionar la tecla 'Escape' redirige a Google Classroom
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = 'https://classroom.google.com';
            }
        });

        // Tab Cloaking: Disfraz de título e icono de Google Drive
        document.title = 'My Drive - Google Drive';
        let favicon = document.querySelector("link[rel*='icon']") || document.createElement('link');
        favicon.type = 'image/x-icon';
        favicon.rel = 'shortcut icon';
        favicon.href = 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png';
        document.getElementsByTagName('head')[0].appendChild(favicon);
    </script>
</body>
</html>
